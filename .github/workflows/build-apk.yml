name: Build TITAN V80.1.2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch full Python engine
        run: |
          set -e
          mkdir -p app/src/main/python

          if [ ! -f titan-v80-python-engine.zip ]; then
            echo "Downloading engine from TITAN-V80-Full-Android..."
            curl -fsSL -L -o titan-v80-python-engine.zip \
              "https://github.com/ehsanrahmanii-code/TITAN-V80-Full-Android/raw/main/titan-v80-python-engine.zip"
          fi

          ls -lh titan-v80-python-engine.zip
          unzip -o titan-v80-python-engine.zip -d /tmp/engine
          if [ -d /tmp/engine/python/titan ]; then
            cp -a /tmp/engine/python/. app/src/main/python/
          elif [ -d /tmp/engine/titan ]; then
            cp -a /tmp/engine/titan app/src/main/python/
          else
            find /tmp/engine -maxdepth 3; exit 1
          fi

          # Optional V80.1.2 nervous patches (skip if PLACEHOLDER or missing)
          if [ -d patches ]; then
            mkdir -p app/src/main/python/titan/layers/analysis app/src/main/python/titan/layers/ui
            apply_one() {
              local src="$1" dst="$2"
              if [ -f "$src" ] && ! grep -q PLACEHOLDER "$src"; then
                base64 -d "$src" | gzip -d > "$dst" && echo "patched $dst"
              fi
            }
            apply_one patches/asset_analysis.py.gz.b64 app/src/main/python/titan/layers/analysis/asset_analysis.py
            apply_one patches/v75_deep_coin_analysis.py.gz.b64 app/src/main/python/titan/layers/ui/v75_deep_coin_analysis.py
            apply_one patches/v79_win11_glass_dashboard.py.gz.b64 app/src/main/python/titan/layers/ui/v79_win11_glass_dashboard.py
          fi

          # Ensure bootstrap from repo is present (not overwritten by zip if zip lacks it)
          if [ -f app/src/main/python/titan_bootstrap.py ]; then
            echo "bootstrap ok"
          else
            echo "WARNING: titan_bootstrap.py missing after extract"
          fi

          test -f app/src/main/python/titan/runtime.py
          COUNT=$(find app/src/main/python -name "*.py" | wc -l)
          echo "py count=$COUNT"
          if [ "$COUNT" -lt 50 ]; then echo "incomplete engine"; exit 1; fi

          python3 << 'PY'
          from pathlib import Path
          p = Path("app/src/main/python/titan/runtime.py")
          if p.is_file():
              raw = p.read_text(encoding="utf-8")
              if "if not path.is_file()" in raw:
                  raw = raw.replace(
                      'if not path.is_file():\n            raise FileNotFoundError(f"TITAN layer missing: {path}")',
                      '# Chaquopy: is_file unreliable on AssetFinder\n        pass',
                  )
                  p.write_text(raw, encoding="utf-8")
                  print("runtime patched for Chaquopy")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Gradle wrapper
        run: |
          set -e
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
          chmod +x gradlew
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' \
            'networkTimeout=120000' \
            'validateDistributionUrl=true' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            > gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Name APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "app/build/outputs/apk/debug/TITAN-PRO-V80.1.2.apk"
          ls -lh "app/build/outputs/apk/debug/TITAN-PRO-V80.1.2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PRO-V80.1.2-APK
          path: app/build/outputs/apk/debug/TITAN-PRO-V80.1.2.apk
          if-no-files-found: error
