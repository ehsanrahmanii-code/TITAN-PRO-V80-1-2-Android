name: Build TITAN V80.1.2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prefer Groovy build.gradle (Chaquopy python block)
        run: |
          set -e
          rm -f app/build.gradle.kts
          test -f app/build.gradle

      - name: Set up Python 3.11 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch full Python engine + Chaquopy patches
        run: |
          set -e
          mkdir -p app/src/main/python
          # Keep checkout bootstrap
          cp -f app/src/main/python/titan_bootstrap.py /tmp/titan_bootstrap.py

          if [ ! -f titan-v80-python-engine.zip ]; then
            curl -fsSL -L -o titan-v80-python-engine.zip \
              "https://github.com/ehsanrahmanii-code/TITAN-V80-Full-Android/raw/main/titan-v80-python-engine.zip"
          fi
          ls -lh titan-v80-python-engine.zip
          unzip -o titan-v80-python-engine.zip -d /tmp/engine
          if [ -d /tmp/engine/python/titan ]; then
            cp -a /tmp/engine/python/. app/src/main/python/
          elif [ -d /tmp/engine/titan ]; then
            cp -a /tmp/engine/titan app/src/main/python/
          else
            find /tmp/engine -maxdepth 3; exit 1
          fi

          # Restore bootstrap (must not be overwritten)
          cp -f /tmp/titan_bootstrap.py app/src/main/python/titan_bootstrap.py

          test -f app/src/main/python/titan/runtime.py
          test -f app/src/main/python/titan/layers/core/bootstrap_storage.py
          COUNT=$(find app/src/main/python -name "*.py" | wc -l)
          echo "py count=$COUNT"
          if [ "$COUNT" -lt 50 ]; then echo "incomplete engine"; exit 1; fi

          # Patch runtime.py for Chaquopy AssetFinder (open works, pathlib often fails)
          python3 << 'PY'
          from pathlib import Path
          p = Path("app/src/main/python/titan/runtime.py")
          raw = p.read_text(encoding="utf-8")
          raw = raw.replace(
              'LAYER_DIR = Path(__file__).resolve().parent / "layers"',
              'LAYER_DIR = Path(__file__).parent / "layers"  # Chaquopy: no resolve()',
          )
          raw = raw.replace(
              '"__file__": str(Path(entry_file).resolve()),',
              '"__file__": str(entry_file),',
          )
          old = '''        path = LAYER_DIR / f"{name}.py"
        if not path.is_file():
            raise FileNotFoundError(f"TITAN layer missing: {path}")
        try:
            src = path.read_text(encoding="utf-8")
            code = compile(src, str(path), "exec", flags=_FLAGS, dont_inherit=True)
        except (OSError, SyntaxError) as exc:
            raise RuntimeError(f"Failed to load TITAN layer {name}: {exc}") from exc'''
          new = '''        path = LAYER_DIR / f"{name}.py"
        path_s = str(path)
        try:
            # Chaquopy AssetFinder: open() works; pathlib.read_text/is_file often fails
            with open(path_s, "r", encoding="utf-8") as _fp:
                src = _fp.read()
            code = compile(src, path_s, "exec", flags=_FLAGS, dont_inherit=True)
        except FileNotFoundError as exc:
            raise FileNotFoundError(f"TITAN layer missing: {path_s}") from exc
        except (OSError, SyntaxError) as exc:
            raise RuntimeError(f"Failed to load TITAN layer {name}: {exc}") from exc'''
          if old in raw:
              raw = raw.replace(old, new)
              print("runtime load-block patched")
          elif "path_s = str(path)" in raw:
              print("runtime already patched")
          else:
              # Fallback: replace read_text only
              raw = raw.replace("src = path.read_text(encoding=\"utf-8\")", "src = open(str(path), encoding=\"utf-8\").read()")
              print("runtime read_text fallback patch")
          p.write_text(raw, encoding="utf-8")
          # Verify core layer present
          core = Path("app/src/main/python/titan/layers/core/bootstrap_storage.py")
          print("bootstrap_storage exists", core.is_file(), core.stat().st_size if core.is_file() else 0)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Gradle wrapper
        run: |
          set -e
          curl -fsSL -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle-8.7-bin.zip -d /opt
          /opt/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-build.log
          tail -n 50 /tmp/gradle-build.log || true

      - name: Name APK
        if: success()
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "app/build/outputs/apk/debug/TITAN-PRO-V80.1.2.apk"
          ls -lh "app/build/outputs/apk/debug/TITAN-PRO-V80.1.2.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PRO-V80.1.2-APK
          path: app/build/outputs/apk/debug/TITAN-PRO-V80.1.2.apk
          if-no-files-found: error

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore
