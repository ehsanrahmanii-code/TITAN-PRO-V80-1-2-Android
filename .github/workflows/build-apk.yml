name: Build TITAN V80.1.2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prefer Groovy build.gradle
        run: |
          set -e
          rm -f app/build.gradle.kts
          test -f app/build.gradle

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch full Python engine + layer zip
        run: |
          set -e
          mkdir -p app/src/main/python
          cp -f app/src/main/python/titan_bootstrap.py /tmp/titan_bootstrap.py

          if [ ! -f titan-v80-python-engine.zip ]; then
            curl -fsSL -L -o titan-v80-python-engine.zip \
              "https://github.com/ehsanrahmanii-code/TITAN-V80-Full-Android/raw/main/titan-v80-python-engine.zip"
          fi
          ls -lh titan-v80-python-engine.zip
          unzip -o titan-v80-python-engine.zip -d /tmp/engine
          if [ -d /tmp/engine/python/titan ]; then
            cp -a /tmp/engine/python/. app/src/main/python/
          elif [ -d /tmp/engine/titan ]; then
            cp -a /tmp/engine/titan app/src/main/python/
          else
            find /tmp/engine -maxdepth 3; exit 1
          fi

          # Restore bootstrap
          cp -f /tmp/titan_bootstrap.py app/src/main/python/titan_bootstrap.py

          test -f app/src/main/python/titan/runtime.py
          test -f app/src/main/python/titan/layers/core/bootstrap_storage.py

          # Bundle layers as zip so device can extract to real filesystem
          # (Chaquopy AssetFinder cannot open nested layer paths reliably)
          (cd app/src/main/python && rm -f titan_layers.zip && zip -r titan_layers.zip titan -x "*.pyc" -x "*__pycache__*")
          ls -lh app/src/main/python/titan_layers.zip
          python3 -c "import zipfile; z=zipfile.ZipFile('app/src/main/python/titan_layers.zip'); assert any('bootstrap_storage' in n for n in z.namelist()); print('zip ok', len(z.namelist()))"

          COUNT=$(find app/src/main/python -name "*.py" | wc -l)
          echo "py count=$COUNT"
          if [ "$COUNT" -lt 50 ]; then echo "incomplete engine"; exit 1; fi

          python3 scripts/patch_runtime_chaquopy.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Gradle wrapper
        run: |
          set -e
          curl -fsSL -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle-8.7-bin.zip -d /opt
          /opt/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-build.log
          tail -n 50 /tmp/gradle-build.log || true

      - name: Name APK
        if: success()
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "app/build/outputs/apk/debug/TITAN-PRO-V80.1.2.apk"
          ls -lh "app/build/outputs/apk/debug/TITAN-PRO-V80.1.2.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PRO-V80.1.2-APK
          path: app/build/outputs/apk/debug/TITAN-PRO-V80.1.2.apk
          if-no-files-found: error

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore
