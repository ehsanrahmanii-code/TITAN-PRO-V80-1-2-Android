plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.titan.v80'
    compileSdk 34

    defaultConfig {
        applicationId "com.titan.v80"
        minSdk 24
        targetSdk 34
        versionCode 815
        versionName "80.1.2-nervous"

        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            version "3.11"
            pip {
                // Must use Chaquopy Android wheels (not PyPI sdist)
                // https://chaquo.com/pypi-13.1/numpy/  and  /pandas/
                install "numpy==1.26.2"
                install "pandas==2.1.3"
                install "flask==3.0.3"
                install "waitress==3.0.0"
                install "requests==2.32.3"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'
}
